<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="64x64" href="/personal-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sajana Wijesinghe</title>

    <!-- SEO / social meta. og:url + og:image use the absolute origin so link-preview cards render. -->
    <meta
      name="description"
      content="Sajana Wijesinghe — software developer crafting secure, responsive, and scalable applications. Explore my projects, experience, and skills."
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Sajana Wijesinghe" />
    <meta
      property="og:description"
      content="Software developer crafting secure, responsive, and scalable applications."
    />
    <meta property="og:url" content="https://sajanaw.com/" />
    <meta
      property="og:image"
      content="https://sajanaw.com/personal-logo.png"
    />
    <meta property="og:image:alt" content="Sajana Wijesinghe logo" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sajana Wijesinghe" />
    <meta
      name="twitter:description"
      content="Software developer crafting secure, responsive, and scalable applications."
    />
    <meta
      name="twitter:image"
      content="https://sajanaw.com/personal-logo.png"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
